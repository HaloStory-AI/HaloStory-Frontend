name: Flutter Multi-Platform Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Install dependencies
        run: flutter pub get
      
      - name: Decode Keystore
        working-directory: android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > app/upload-keystore.jks

      - name: Create key.properties
        working-directory: android
        env:
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > key.properties <<- EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Build Android APK
        run: flutter build apk --release --split-per-abi

      - name: Extract version
        run: |
          VER=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "VERSION_NAME=$VER" >> $GITHUB_ENV

      - name: Rename APKs
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            cpu=$(echo "$f" | sed 's/app-\(.*\)-release\.apk/\1/')
            mv "$f" "HaloStory_AI-V${VERSION_NAME}-$cpu.apk"
          done
          ls -la

      - name: Upload APKs to B2
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET_ID: ${{ secrets.B2_BUCKET_ID }}
        run: |
          AUTH=$(curl -s -u "${B2_KEY_ID}:${B2_APP_KEY}" \
            "https://api.backblazeb2.com/b2api/v2/b2_authorize_account")
          AUTH_TOKEN=$(echo "$AUTH" | jq -r '.authorizationToken')
          API_URL=$(echo "$AUTH" | jq -r '.apiUrl')

          UPLOAD_INFO=$(curl -s -X POST "${API_URL}/b2api/v2/b2_get_upload_url" \
            -H "Authorization: ${AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"bucketId\": \"${B2_BUCKET_ID}\"}")
          UPLOAD_URL=$(echo "$UPLOAD_INFO" | jq -r '.uploadUrl')
          UPLOAD_TOKEN=$(echo "$UPLOAD_INFO" | jq -r '.authorizationToken')

          cd build/app/outputs/flutter-apk
          for f in HaloStory_AI-V*.apk; do
            [ -f "$f" ] || continue
            echo "Uploading $f ..."
            SHA1=$(sha1sum "$f" | cut -d' ' -f1)
            curl -X POST \
              -H "Authorization: ${UPLOAD_TOKEN}" \
              -H "X-Bz-File-Name: $(jq -nr --arg v "$f" '$v|@uri')" \
              -H "Content-Type: application/vnd.android.package-archive" \
              -H "X-Bz-Content-Sha1: ${SHA1}" \
              --data-binary "@$f" \
              "${UPLOAD_URL}"
            echo ""
          done

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Release-APK
          path: build/app/outputs/flutter-apk/HaloStory_AI-V*.apk

  build-linux:
    name: Build Linux Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Enable Linux Desktop
        run: flutter config --enable-linux-desktop
      
      - name: Install dependencies
        run: flutter pub get
        
      - name: Build Linux
        run: flutter build linux --release

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Release
          path: build/linux/x64/release/bundle/

  build-windows:
    name: Build Windows Release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          $ver = (Select-String '^version: ' pubspec.yaml).Line -replace 'version: ',''
          $ver = $ver -replace '\+.*$',''
          Add-Content -Path $env:GITHUB_ENV -Value "VERSION_NAME=$ver"

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --confirm --limit-output

      - name: Compile installer
        shell: cmd
        run: iscc /dAppVersion="%VERSION_NAME%" installer\setup.iss

      - name: Upload Installer to B2
        shell: pwsh
        env:
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_BUCKET_ID: ${{ secrets.B2_BUCKET_ID }}
        run: |
          # Helper: URL encode
          function UrlEncode($s) {
            return [System.Uri]::EscapeDataString($s)
          }

          # Authorize
          $pair = "$($env:B2_KEY_ID):$($env:B2_APP_KEY)"
          $bytes = [System.Text.Encoding]::ASCII.GetBytes($pair)
          $b64 = [System.Convert]::ToBase64String($bytes)
          $auth = Invoke-RestMethod -Uri "https://api.backblazeb2.com/b2api/v2/b2_authorize_account" -Headers @{Authorization = "Basic $b64"}
          $authToken = $auth.authorizationToken
          $apiUrl = $auth.apiUrl

          # Get upload URL
          $body = "{`"bucketId`": `"$env:B2_BUCKET_ID`"}"
          $uploadInfo = Invoke-RestMethod -Uri "${apiUrl}/b2api/v2/b2_get_upload_url" -Method Post -Headers @{Authorization = $authToken; "Content-Type" = "application/json"} -Body $body
          $uploadUrl = $uploadInfo.uploadUrl
          $uploadToken = $uploadInfo.authorizationToken

          $installerDir = Join-Path $pwd "build\installer"
          Get-ChildItem -Path $installerDir -Filter "*.exe" | ForEach-Object {
            $f = $_.FullName
            $name = $_.Name
            Write-Host "Uploading $name ..."
            $sha1 = (Get-FileHash -Algorithm SHA1 $f).Hash.ToLower()
            $encoded = UrlEncode($name)

            curl.exe -X POST `
              -H "Authorization: $uploadToken" `
              -H "X-Bz-File-Name: $encoded" `
              -H "Content-Type: application/octet-stream" `
              -H "X-Bz-Content-Sha1: $sha1" `
              --data-binary "@$f" `
              $uploadUrl
            Write-Host ""
          }

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Installer
          path: build/installer/HaloStory_AI_V*.exe

      - name: Upload Windows Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Release
          path: build/windows/x64/runner/Release/
